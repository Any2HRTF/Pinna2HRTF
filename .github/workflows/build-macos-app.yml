name: Build apps

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify arm64 runner
        run: |
          test "$(uname -m)" = "arm64"
          swift --version

      - name: Prepare external tools
        run: ./Sources/Pinna2HRTF/Scripts/prepare_external_tools.sh

      - name: Build release app bundle
        run: ./Sources/Pinna2HRTF/Scripts/build_release_app.sh

      - name: Verify arm64 binaries
        run: |
          app="build/release/Pinna2HRTF.app"
          resources="$app/Contents/Resources"
          lipo -archs "$app/Contents/MacOS/Pinna2HRTF" | grep -qw arm64
          file "$resources/External/bin/NumCalc" | grep -qw arm64
          file "$resources/External/bin/hrtf_mesh_grading" | grep -qw arm64
          test ! -e "$resources/External/bin/uv"
          test ! -e "$resources/.venv/bin/Pinna2HRTF"
          test ! -d "$resources/.venv/lib/python3.11/site-packages/cv2"
          test ! -d "$resources/.venv/lib/python3.11/site-packages/polars"
          test ! -d "$resources/.venv/lib/python3.11/site-packages/pyglet"
          test ! -d "$resources/.venv/lib/python3.11/site-packages/seaborn"
          test "$(du -sk "$app" | cut -f1)" -le 2097152
          cache="$RUNNER_TEMP/pinna2hrtf-smoke"
          mkdir -p "$cache/matplotlib" "$cache/python" "$cache/blender/config" "$cache/blender/scripts" "$cache/blender/datafiles"
          MPLCONFIGDIR="$cache/matplotlib" PYTHONPYCACHEPREFIX="$cache/python" PYTHONNOUSERSITE=1 BLENDER_USER_CONFIG="$cache/blender/config" BLENDER_USER_SCRIPTS="$cache/blender/scripts" BLENDER_USER_DATAFILES="$cache/blender/datafiles" PYTHONPATH="$resources" "$resources/.venv/bin/python" -m HRTFCalculation --help

      - name: Verify relocated app
        run: |
          destination="$RUNNER_TEMP/Pinna2HRTF Relocation Test"
          ditto build/release/Pinna2HRTF.app "$destination/Pinna2HRTF.app"
          resources="$destination/Pinna2HRTF.app/Contents/Resources"
          cache="$RUNNER_TEMP/pinna2hrtf-relocated-smoke"
          mkdir -p "$cache/matplotlib" "$cache/python" "$cache/blender/config" "$cache/blender/scripts" "$cache/blender/datafiles"
          MPLCONFIGDIR="$cache/matplotlib" PYTHONPYCACHEPREFIX="$cache/python" PYTHONNOUSERSITE=1 BLENDER_USER_CONFIG="$cache/blender/config" BLENDER_USER_SCRIPTS="$cache/blender/scripts" BLENDER_USER_DATAFILES="$cache/blender/datafiles" PYTHONPATH="$resources" "$resources/.venv/bin/python" -m HRTFCalculation --help

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - build/release/Pinna2HRTF.app
          codesign --verify --deep --strict build/release/Pinna2HRTF.app

      - name: Create zip
        run: ditto -c -k --sequesterRsrc --keepParent build/release/Pinna2HRTF.app build/release/Pinna2HRTF-macos.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinna2HRTF-macos
          path: build/release/Pinna2HRTF-macos.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/Pinna2HRTF-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Subversion
        shell: pwsh
        run: choco install svn -y --no-progress

      - name: Prepare external tools
        shell: pwsh
        run: .\Scripts\prepare_windows_external_tools.ps1

      - name: Build portable Windows app
        shell: pwsh
        run: .\Scripts\build_windows_port.ps1

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $root = Resolve-Path "dist\windows\Pinna2HRTF"
          $paths = @(
            "$root\Pinna2HRTF.Windows.exe",
            "$root\External\bin\NumCalc.exe",
            "$root\External\bin\hrtf_mesh_grading.exe",
            "$root\External\src\Mesh2HRTF\mesh2hrtf\Mesh2Input\mesh2input.py",
            "$root\.venv\Scripts\python.exe",
            "$root\Python"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "Missing bundled Windows runtime path: $path"
            }
          }
          foreach ($path in @(
            "$root\External\bin\uv.exe",
            "$root\.venv\Scripts\Pinna2HRTF.exe",
            "$root\.venv\Lib\site-packages\cv2",
            "$root\.venv\Lib\site-packages\polars",
            "$root\.venv\Lib\site-packages\pyglet",
            "$root\.venv\Lib\site-packages\seaborn"
          )) {
            if (Test-Path $path) {
              throw "Unexpected bundled runtime path: $path"
            }
          }
          $env:PYTHONPATH = $root
          $env:PYTHONNOUSERSITE = "1"
          & "$root\.venv\Scripts\python.exe" -m HRTFCalculation --help
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Windows Python smoke test failed."
          }

      - name: Verify relocated Windows app
        shell: pwsh
        run: |
          $parent = Join-Path $env:RUNNER_TEMP "Pinna2HRTF Relocation Test"
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          $destination = Join-Path $parent "Pinna2HRTF"
          Copy-Item "dist\windows\Pinna2HRTF" $destination -Recurse -Force
          $env:PYTHONPATH = $destination
          $env:PYTHONNOUSERSITE = "1"
          & "$destination\.venv\Scripts\python.exe" -m HRTFCalculation --help
          if ($LASTEXITCODE -ne 0) {
            throw "Relocated Windows Python smoke test failed."
          }

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path dist\windows\Pinna2HRTF -DestinationPath dist\windows\Pinna2HRTF-windows.zip -Force

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinna2HRTF-windows
          path: dist/windows/Pinna2HRTF-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/Pinna2HRTF-windows.zip
