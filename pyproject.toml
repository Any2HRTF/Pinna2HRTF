[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinna2hrtf"
version = "1.0.0"
description = "Calculate individualized HRTFs from pinna meshes."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "bpy==4.3",
    "matplotlib>=3.10.0",
    "meshio>=5.3.5",
    "numpy<2.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "polars>=1.22.0",
    "pydantic>=2.10.0",
    "pyglet>=2.1.2",
    "pyyaml>=6.0.2",
    "rtree>=1.3.0",
    "seaborn>=0.13.2",
    "shapely>=2.0.7",
    "timm>=1.0.14",
    "torch>=2.6.0",
    "triangle==20250106",
    "trimesh>=4.6.3",
    "pybezierppm@git+https://github.com/Any2HRTF/PPM@cd8c224578808f5a729102068ceeed9d9ebe07dd",
    "mesh2hrtf@git+https://github.com/Any2HRTF/Mesh2HRTF@e45d0436a6fbeca3db13828cbae23ca109225be3",
]

[project.scripts]
Pinna2HRTF = "HRTFCalculation.CLI:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["HRTFCalculation*"]

[tool.setuptools.package-data]
"HRTFCalculation.Inference" = ["resources/*.csv", "resources/*.pth", "resources/*.stl", "resources/*.yaml"]
